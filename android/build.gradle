group 'com.appcues.flutter.sdk'
version '5.0.3'

buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

android {
    namespace "com.appcues.flutter"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
    }
}

// AGP 8 / explicit KGP: pin jvmTarget. Flutter's Android Studio JDK is 21;
// without this, KGP 1.8 tries target 21 and fails.
// AGP 9 built-in Kotlin: android.kotlinOptions does not exist; jvmTarget
// follows compileOptions (1.8).
try {
    android.kotlinOptions {
        jvmTarget = '1.8'
    }
} catch (MissingMethodException ignored) {
    logger.info("android.kotlinOptions is not available, so jvmTarget follows compileOptions")
}

dependencies {
    api 'com.appcues:appcues:5.0.3'
}
